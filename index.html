<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Resmi Wahid Fahmi</title>
    <style>
        /* Ini adalah CSS untuk menghias website Anda */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .card {
            background: white;
            max-width: 450px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #2ebaae;
            object-fit: cover;
        }
        h1 {
            color: #2ebaae;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background-color: #2ebaae;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #1a9489;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Mengambil otomatis foto profil GitHub Anda -->
        <img src="https://github.com/wahidfahmi.png" alt="Foto Wahid Fahmi" class="avatar">
        
        <h1>Wahid Fahmi</h1>
        <p>Halo! Selamat datang di website pribadi saya. Saya sedang belajar web development dan ini adalah proyek pertama saya yang di-hosting di GitHub Pages.</p>
        
        <!-- Ganti tanda # di bawah dengan link instagram atau medsos Anda jika ada -->
        <a href="https://www.instagram.com/wahid_fahmiza/" class="btn">Hubungi Saya</a>
    </div>

</body>
</html>
